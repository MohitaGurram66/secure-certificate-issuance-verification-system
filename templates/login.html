{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="modern-card animate-fade-in">
            <div class="text-center mb-4">
                <h2 class="fw-bold mb-1">Welcome Back</h2>
                <p class="text-muted small">Access your secure dashboard</p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Username or Email</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter your credentials"
                        required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg shadow-sm">Login</button>
                    <a href="{{ url_for('auth.register') }}" class="btn btn-outline-light btn-sm mt-2">Create
                        Account</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
