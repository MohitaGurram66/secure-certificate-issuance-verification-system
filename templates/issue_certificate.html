{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center mt-5 mb-5">
    <div class="col-md-8 col-lg-7">
        <div class="modern-card animate-fade-in p-4 p-md-5">
            <h2 class="mb-4 text-center fw-bold">Issue New Certificate</h2>
            <p class="text-center text-muted mb-5">Fill in the details below. The certificate will be digitally signed
                using RSA-2048.</p>

            <form method="POST">
                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label">Student Name</label>
                        <input type="text" name="student_name" class="form-control" placeholder="Full Name" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Student Email</label>
                        <input type="email" name="student_email" class="form-control" placeholder="student@example.com"
                            required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Course Name</label>
                        <input type="text" name="course_name" class="form-control"
                            placeholder="e.g. Advanced Cybersecurity" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Expiry Date (Optional)</label>
                        <input type="date" name="expiry_date" class="form-control">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Confidential Remarks</label>
                        <textarea name="remarks" class="form-control" rows="4"
                            placeholder="These remarks will be encrypted..."></textarea>
                    </div>
                </div>

                <div class="d-grid mt-5">
                    <button type="submit" class="btn btn-primary btn-lg">Sign & Issue Certificate</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
