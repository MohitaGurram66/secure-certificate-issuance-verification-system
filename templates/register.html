{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center mt-5 mb-5">
    <div class="col-md-6 col-lg-5">
        <div class="modern-card animate-fade-in">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-primary">Create Account</h2>
                <p class="text-muted small">Join the secure certificate network</p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Choose a unique username"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Select Role</label>
                    <div class="d-flex gap-2 p-2 rounded"
                        style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-color);">
                        <select name="role" class="form-select border-0 bg-transparent text-light" id="roleSelect">
                            <option value="user">Student (User)</option>
                            <option value="issuer">Issuer (Authority)</option>
                            <option value="verifier">Verifier (Auditor)</option>
                            <option value="admin" class="text-danger fw-bold">Admin (System Owner)</option>
                        </select>
                    </div>
                </div>

                <!-- Secret Field Removed as per user request -->

                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Create a strong password"
                        required>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg shadow-sm">Get Started</button>
                    <a href="{{ url_for('auth.login') }}" class="btn btn-outline-light">Already have an account?
                        Login</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
