{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="glass-card animate-fade-in">
            <h3 class="text-center mb-4">MFA Verification</h3>
            <p class="text-center text-muted mb-4">Enter the 6-digit code from your authenticator app.</p>
            <form method="POST">
                <div class="mb-4">
                    <input type="text" name="otp" class="form-control text-center fs-3" placeholder="000 000"
                        maxlength="6" required autofocus>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">Verify</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
